# This bundle replaces the pi-ai adapter and adds the Copilot search and guard
# behaviours: never enable another adapter for the same route.
# Copy any other provider configuration into the replacement before enabling.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  disabled: true
# Select the search provider explicitly: the base profile pins DeepSeek search.
# This does not replace an LLM adapter or change its model/provider configuration.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: github-copilot-search
    fetchProvider: http
- insert:
    - id: better-copilot
      name: dsh-better-copilot
      config:
        providers:
          github-copilot: {}
        search: {}
        toolSchema: {}
