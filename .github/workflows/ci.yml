name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Install without dependency lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify all plugins and TypeScript tooling
        run: pnpm run verify

  minimum-pi:
    name: Minimum Better Copilot pi-ai 1.3.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      # Better Copilot's rc2 adapter and published peer range require ^1.3.0.
      # Pin its oldest supported pi-ai, leaving Worktrees/root rc1 independent.
      # This scoped override exists only in CI; pnpm 11 reads it from the workspace.
      - name: Pin the minimum supported pi-ai in this checkout only
        run: |
          printf "overrides:\n  '@deepseek-ai/dsh-llm-pi-ai@0.2.2-rc.2>@earendil-works/pi-ai': 1.3.0\n" >> pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Assert the Better Copilot adapter-resolved pi-ai version
        run: pnpm exec tsx scripts/check-pi.ts 1.3.0 packages/better-copilot
      - name: Verify all plugins against the minimum pi-ai
        run: pnpm run verify
