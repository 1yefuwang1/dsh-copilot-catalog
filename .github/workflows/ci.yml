name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Install without dependency lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify all plugins and TypeScript tooling
        run: pnpm run verify

  minimum-pi:
    name: Minimum pi-ai 1.1.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      # The published peer range is the host adapter's ^1.1.0, so the oldest
      # supported pi-ai must build and pass every suite. This override exists only
      # in the CI checkout; shipped manifests and the lockfile keep 1.3.0.
      # pnpm 11 ignores the package.json "pnpm" field; overrides belong in the
      # workspace file, which is the only place this job edits.
      - name: Pin the minimum supported pi-ai in this checkout only
        run: |
          printf "overrides:\n  '@earendil-works/pi-ai': 1.1.0\n" >> pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Assert the adapter-resolved pi-ai version
        run: pnpm exec tsx scripts/check-pi.ts 1.1.0
      - name: Verify all plugins against the minimum pi-ai
        run: pnpm run verify
