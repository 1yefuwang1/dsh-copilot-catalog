name: Stage package on npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Validate package-specific release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/release.mjs
      - name: Install without dependency lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify both plugin packages
        run: pnpm run verify
      - name: Stage only the selected package using trusted publishing
        working-directory: ${{ steps.release.outputs.directory }}
        # pnpm exchanges short-lived OIDC identity; no registry token is stored.
        # The release gate validates the exact package/version/repository for this
        # immutable tag checkout; normal publish-branch checks do not fit detached tags.
        # A maintainer reviews and approves the staged version with 2FA.
        run: pnpm stage publish --provenance --access public --config.ignore-scripts=true --no-git-checks
